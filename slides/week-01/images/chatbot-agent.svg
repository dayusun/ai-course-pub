<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="A chatbot answers one question; an agent takes a goal and loops through actions with tools">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker></defs>
<rect width="1500" height="600" fill="#f7f3ea"/>
<rect x="30.0" y="30.0" width="640.0" height="540.0" rx="18" fill="#fffdf8" stroke="#ddd5c6" stroke-width="2"/>
<text x="350.0" y="86.0" font-size="34" fill="#4b0000" text-anchor="middle" font-weight="700">Chatbot</text>
<text x="350.0" y="122.0" font-size="21" fill="#68635d" text-anchor="middle" font-weight="400">one request, one answer</text>
<rect x="90.0" y="170.0" width="180.0" height="90.0" rx="12" fill="#f7f3ea" stroke="#4b0000" stroke-width="2"/>
<text x="180.0" y="225.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">You</text>
<rect x="430.0" y="170.0" width="180.0" height="90.0" rx="12" fill="#f7f3ea" stroke="#4b0000" stroke-width="2"/>
<text x="520.0" y="225.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Model</text>
<line x1="274.0" y1="200.0" x2="426.0" y2="200.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="350.0" y="188.0" font-size="19" fill="#990000" text-anchor="middle" font-weight="600">question</text>
<line x1="426.0" y1="236.0" x2="274.0" y2="236.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="350.0" y="272.0" font-size="19" fill="#990000" text-anchor="middle" font-weight="600">answer (text)</text>
<text x="350.0" y="380.0" font-size="22" fill="#20201e" text-anchor="middle" font-weight="400">You read it, check it,</text>
<text x="350.0" y="412.0" font-size="22" fill="#20201e" text-anchor="middle" font-weight="400">and take the next step yourself.</text>
<rect x="830.0" y="30.0" width="640.0" height="540.0" rx="18" fill="#fffdf8" stroke="#e3a617" stroke-width="3"/>
<text x="1150.0" y="86.0" font-size="34" fill="#4b0000" text-anchor="middle" font-weight="700">Agent</text>
<text x="1150.0" y="122.0" font-size="21" fill="#68635d" text-anchor="middle" font-weight="400">one goal, many steps</text>
<rect x="880.0" y="170.0" width="160.0" height="90.0" rx="12" fill="#f7f3ea" stroke="#4b0000" stroke-width="2"/>
<text x="960.0" y="225.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">You</text>
<rect x="1150.0" y="170.0" width="180.0" height="90.0" rx="12" fill="#f7f3ea" stroke="#4b0000" stroke-width="2"/>
<text x="1240.0" y="225.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Model</text>
<line x1="1044.0" y1="215.0" x2="1146.0" y2="215.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="1095.0" y="200.0" font-size="19" fill="#990000" text-anchor="middle" font-weight="600">goal</text>
<rect x="1150.0" y="360.0" width="180.0" height="90.0" rx="12" fill="#f7f3ea" stroke="#4b0000" stroke-width="2"/>
<text x="1240.0" y="405.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Tools</text>
<text x="1240.0" y="434.0" font-size="17" fill="#68635d" text-anchor="middle" font-weight="400">code, files, web</text>
<path d="M 1300 264 C 1360 300, 1360 320, 1300 356" fill="none" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 1180 356 C 1120 320, 1120 300, 1180 264" fill="none" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="1372.0" y="316.0" font-size="19" fill="#990000" text-anchor="start" font-weight="600">act</text>
<text x="1108.0" y="316.0" font-size="19" fill="#990000" text-anchor="end" font-weight="600">observe</text>
<text x="1150.0" y="500.0" font-size="22" fill="#20201e" text-anchor="middle" font-weight="400">Plans, acts, checks the result, repeats,</text>
<text x="1150.0" y="532.0" font-size="22" fill="#20201e" text-anchor="middle" font-weight="400">until the goal is met or it is stopped.</text>
</svg>
