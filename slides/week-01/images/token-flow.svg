<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="Flow: your text goes through the tokenizer into input tokens, the LLM produces output and reasoning tokens, which become text">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker></defs>
<rect width="1500" height="430" fill="#f7f3ea"/>
<rect x="30.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fffdf8" stroke="#ddd5c6" stroke-width="2.5"/>
<text x="130.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">Your text</text>
<text x="130.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">prompt, files, history</text>
<line x1="234.0" y1="155.0" x2="278.0" y2="155.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="282.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fffdf8" stroke="#ddd5c6" stroke-width="2.5"/>
<text x="382.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">Tokenizer</text>
<text x="382.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">text → token IDs</text>
<line x1="486.0" y1="155.0" x2="530.0" y2="155.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="534.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fbefd6" stroke="#e3a617" stroke-width="2.5"/>
<text x="634.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">Input tokens</text>
<text x="634.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">resent every turn</text>
<line x1="738.0" y1="155.0" x2="782.0" y2="155.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="786.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2.5"/>
<text x="886.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">LLM</text>
<text x="886.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">one token at a time</text>
<line x1="990.0" y1="155.0" x2="1034.0" y2="155.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1038.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fbefd6" stroke="#e3a617" stroke-width="2.5"/>
<text x="1138.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">Output tokens</text>
<text x="1138.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">≈5× the input price</text>
<line x1="1242.0" y1="155.0" x2="1286.0" y2="155.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1290.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#fffdf8" stroke="#ddd5c6" stroke-width="2.5"/>
<text x="1390.0" y="148.0" font-size="27" fill="#4b0000" text-anchor="middle" font-weight="700">Text</text>
<text x="1390.0" y="186.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">the answer you read</text>
<line x1="886.0" y1="224.0" x2="886.0" y2="300.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="696.0" y="304.0" width="380.0" height="92.0" rx="12" fill="#fffdf8" stroke="#990000" stroke-width="2.5"/>
<text x="886.0" y="342.0" font-size="25" fill="#990000" text-anchor="middle" font-weight="700">Reasoning tokens</text>
<text x="886.0" y="374.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">often hidden, still billed as output</text>
<text x="30.0" y="50.0" font-size="24" fill="#20201e" text-anchor="start" font-weight="600">Everything you pay for, and every limit you hit, is counted in tokens.</text>
</svg>
