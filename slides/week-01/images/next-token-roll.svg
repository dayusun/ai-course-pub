<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="Next-token probabilities for a medical sentence; two different rolls lead to two different continuations">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker></defs>
<rect width="1500" height="560" fill="#f7f3ea"/>
<text x="40.0" y="52.0" font-size="28" fill="#20201e" text-anchor="start" font-weight="700">“The patient was diagnosed with ___”</text>
<text x="40.0" y="86.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">probabilities for the next token (illustrative)</text>
<text x="250.0" y="148.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">hypertension</text>
<rect x="262" y="126" width="152.0" height="32" rx="4" fill="#e3a617"/>
<text x="424.0" y="150.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">18%</text>
<text x="250.0" y="210.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">diabetes</text>
<rect x="262" y="188" width="126.7" height="32" rx="4" fill="#e3a617"/>
<text x="398.7" y="212.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">15%</text>
<text x="250.0" y="272.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">a</text>
<rect x="262" y="250" width="101.3" height="32" rx="4" fill="#2a78d6"/>
<text x="373.3" y="274.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">12%</text>
<text x="250.0" y="334.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">cancer</text>
<rect x="262" y="312" width="76.0" height="32" rx="4" fill="#2a78d6"/>
<text x="348.0" y="336.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">9%</text>
<text x="250.0" y="396.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">COVID</text>
<rect x="262" y="374" width="42.2" height="32" rx="4" fill="#2a78d6"/>
<text x="314.2" y="398.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">5%</text>
<text x="250.0" y="458.0" font-size="22" fill="#20201e" text-anchor="end" font-weight="400">≈200,000 others</text>
<rect x="262" y="436" width="346.2" height="32" rx="4" fill="#68635d"/>
<text x="618.2" y="460.0" font-size="20" fill="#68635d" text-anchor="start" font-weight="400">41%</text>
<text x="400.0" y="524.0" font-size="21" fill="#4b0000" text-anchor="middle" font-weight="600">Sampling = a weighted die roll over all of them.</text>
<line x1="760.0" y1="300.0" x2="846.0" y2="210.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="850.0" y="140.0" width="610.0" height="140.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="874.0" y="186.0" font-size="24" fill="#4b0000" text-anchor="start" font-weight="700">roll 1 → “hypertension”</text>
<text x="874.0" y="234.0" font-size="21" fill="#20201e" text-anchor="start" font-weight="400">… and started on a low-dose ACE inhibitor.</text>
<line x1="760.0" y1="300.0" x2="846.0" y2="400.0" stroke="#4b0000" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="850.0" y="330.0" width="610.0" height="140.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="874.0" y="376.0" font-size="24" fill="#4b0000" text-anchor="start" font-weight="700">roll 2 → “diabetes”</text>
<text x="874.0" y="424.0" font-size="21" fill="#20201e" text-anchor="start" font-weight="400">… after a routine fasting glucose test.</text>
<text x="1155.0" y="512.0" font-size="20" fill="#68635d" text-anchor="middle" font-weight="400">Each token is appended and the roll repeats: one early</text>
<text x="1155.0" y="540.0" font-size="20" fill="#68635d" text-anchor="middle" font-weight="400">difference sends the whole answer down another path.</text>
</svg>
