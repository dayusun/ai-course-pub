<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="Five workflow patterns. Prompt chaining: extract, check, normalize, check, summarize. Routing: classify, then send each item to one specialist route. Parallelization: one input, several runs, then combine or vote; voting is not validation. Orchestrator-workers: a planner picks subtasks at run time, workers do them, results are synthesized; name a human owner. Evaluator-optimizer: a generator drafts, an evaluator gives feedback until the draft passes; write the criteria first">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker><marker id="arrg" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#b3aa9b"/></marker></defs>
<rect width="1500" height="660" fill="#f7f3ea"/>
<rect x="40" y="40" width="1420" height="104" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70" y="84" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Prompt chaining</text>
<text x="70" y="120" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">fixed steps; a check between them</text>
<text x="1430" y="102" font-size="20" fill="#990000" text-anchor="end" font-weight="600">check between steps</text>
<rect x="40" y="162" width="1420" height="104" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70" y="206" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Routing</text>
<text x="70" y="242" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">classify first, then one specialist</text>
<text x="1430" y="224" font-size="20" fill="#990000" text-anchor="end" font-weight="600">mixed documents, triage</text>
<rect x="40" y="284" width="1420" height="104" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70" y="328" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Parallelization</text>
<text x="70" y="364" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">split the work, or vote on one task</text>
<text x="1430" y="346" font-size="20" fill="#990000" text-anchor="end" font-weight="600">voting is not validation</text>
<rect x="40" y="406" width="1420" height="104" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70" y="450" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Orchestrator–workers</text>
<text x="70" y="486" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">a planner picks subtasks at run time</text>
<text x="1430" y="468" font-size="20" fill="#990000" text-anchor="end" font-weight="600">name a human owner</text>
<rect x="40" y="528" width="1420" height="104" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2"/>
<text x="70" y="572" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Evaluator–optimizer</text>
<text x="70" y="608" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">produce, critique against criteria, repeat</text>
<text x="1430" y="590" font-size="20" fill="#990000" text-anchor="end" font-weight="600">write the criteria first</text>
<rect x="560" y="72" width="120" height="40" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/><text x="620.0" y="97.76" font-size="16" fill="#20201e" text-anchor="middle" font-weight="500">extract</text>
<rect x="760" y="72" width="120" height="40" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/><text x="820.0" y="97.76" font-size="16" fill="#20201e" text-anchor="middle" font-weight="500">normalize</text>
<rect x="960" y="72" width="120" height="40" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/><text x="1020.0" y="97.76" font-size="16" fill="#20201e" text-anchor="middle" font-weight="500">summarize</text>
<path d="M 682 92 L 756 92" fill="none" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
<text x="718" y="82" font-size="15" fill="#990000" text-anchor="middle" font-weight="600">check</text>
