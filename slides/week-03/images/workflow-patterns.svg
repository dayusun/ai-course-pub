<text x="1010" y="219" font-size="15" fill="#68635d" text-anchor="start" font-weight="400" font-style="italic">one route</text>
<rect x="560" y="316" width="90" height="40" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/><text x="605.0" y="341.76" font-size="16" fill="#20201e" text-anchor="middle" font-weight="500">input</text>
