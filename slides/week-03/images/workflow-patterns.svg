<rect x="800" y="201" width="150" height="26" rx="6" fill="#ffffff" stroke="#4b0000" stroke-width="1.5"/><text x="875.0" y="219.4" font-size="15" fill="#20201e" text-anchor="middle" font-weight="600">consent form</text>
