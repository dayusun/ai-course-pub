<rect x="560" y="438" width="120" height="40" rx="6" fill="#ffffff" stroke="#4b0000" stroke-width="1.5"/><text x="620.0" y="463.76" font-size="16" fill="#20201e" text-anchor="middle" font-weight="500">planner</text>
<rect x="760" y="413" width="110" height="26" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="815.0" y="431.4" font-size="15" fill="#20201e" text-anchor="middle" font-weight="500">subtask ?</text>
