<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="Approval and sandbox are separate controls: the sandbox bounds where the agent can act; approval rules decide when it must ask (read allow, edit in project allow, shell ask, web ask, outside project deny); plan mode proposes steps without changing anything">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker></defs>
<rect width="1500" height="560" fill="#f7f3ea"/>
<rect x="40.0" y="40.0" width="1420.0" height="480.0" rx="18" fill="#e3eef9" stroke="#4b0000" stroke-width="3"/>
<text x="70.0" y="90.0" font-size="28" fill="#4b0000" text-anchor="start" font-weight="700">Sandbox: where the agent can act at all</text>
<text x="70.0" y="124.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">your container: your files only; no other students, no host, only approved websites</text>
<rect x="90.0" y="170.0" width="780.0" height="310.0" rx="16" fill="#fffdf8" stroke="#e3a617" stroke-width="3"/>
<text x="120.0" y="216.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Approval: when it must ask you</text>
<text x="130.0" y="270.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">read files</text>
<rect x="560.0" y="250.0" width="120.0" height="32.0" rx="8" fill="#ffffff" stroke="#3f7d3a" stroke-width="2"/>
<text x="620.0" y="273.0" font-size="19" fill="#3f7d3a" text-anchor="middle" font-weight="700">allow</text>
<text x="130.0" y="314.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">edit files in the project</text>
<rect x="560.0" y="294.0" width="120.0" height="32.0" rx="8" fill="#ffffff" stroke="#3f7d3a" stroke-width="2"/>
<text x="620.0" y="317.0" font-size="19" fill="#3f7d3a" text-anchor="middle" font-weight="700">allow</text>
<text x="130.0" y="358.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">run a shell command</text>
<rect x="560.0" y="338.0" width="120.0" height="32.0" rx="8" fill="#ffffff" stroke="#e3a617" stroke-width="2"/>
<text x="620.0" y="361.0" font-size="19" fill="#e3a617" text-anchor="middle" font-weight="700">ask</text>
<text x="130.0" y="402.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">fetch a web page</text>
<rect x="560.0" y="382.0" width="120.0" height="32.0" rx="8" fill="#ffffff" stroke="#e3a617" stroke-width="2"/>
<text x="620.0" y="405.0" font-size="19" fill="#e3a617" text-anchor="middle" font-weight="700">ask</text>
<text x="130.0" y="446.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">edit outside the project</text>
<rect x="560.0" y="426.0" width="120.0" height="32.0" rx="8" fill="#ffffff" stroke="#990000" stroke-width="2"/>
<text x="620.0" y="449.0" font-size="19" fill="#990000" text-anchor="middle" font-weight="700">deny</text>
<rect x="930.0" y="170.0" width="490.0" height="310.0" rx="16" fill="#fffdf8" stroke="#ddd5c6" stroke-width="2"/>
<text x="1175.0" y="216.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Plan mode</text>
<text x="960.0" y="270.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">• the agent proposes steps</text>
<text x="960.0" y="316.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">• nothing is changed or run</text>
<text x="960.0" y="362.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">• you review, then switch to build</text>
</svg>
