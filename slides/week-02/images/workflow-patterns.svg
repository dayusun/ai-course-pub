<text x="70.0" y="572.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Evaluator–optimizer</text>
<text x="70.0" y="608.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">produce, critique against criteria, repeat</text>
<text x="1430.0" y="590.0" font-size="20" fill="#990000" text-anchor="end" font-weight="600">write the criteria first</text>
<rect x="760.0" y="560.0" width="90.0" height="40.0" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/>
