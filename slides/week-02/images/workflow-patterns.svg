<rect x="40.0" y="40.0" width="1420.0" height="104.0" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70.0" y="84.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Prompt chaining</text>
<text x="70.0" y="120.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">extract → normalize → summarize</text>
<text x="1430.0" y="102.0" font-size="20" fill="#990000" text-anchor="end" font-weight="600">check between steps</text>
<rect x="760.0" y="72.0" width="80.0" height="40.0" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/>
<line x1="842.0" y1="92.0" x2="868.0" y2="92.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="870.0" y="72.0" width="80.0" height="40.0" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/>
