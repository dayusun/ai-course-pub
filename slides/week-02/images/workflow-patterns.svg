<rect x="952.0" y="202.0" width="60.0" height="24.0" rx="4" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.2"/>
<line x1="842.0" y1="214.0" x2="950.0" y2="238.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="952.0" y="226.0" width="60.0" height="24.0" rx="4" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.2"/>
<rect x="40.0" y="284.0" width="1420.0" height="104.0" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70.0" y="328.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Parallelization</text>
<text x="70.0" y="364.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">split the work, or vote on one task</text>
<text x="1430.0" y="346.0" font-size="20" fill="#990000" text-anchor="end" font-weight="600">voting is not validation</text>
<rect x="820.0" y="298.0" width="80.0" height="24.0" rx="4" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.2"/>
<line x1="902.0" y1="310.0" x2="980.0" y2="336.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
