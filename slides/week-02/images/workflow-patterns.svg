<text x="70.0" y="206.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Routing</text>
<text x="70.0" y="242.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">classify first, then send to a specialist</text>
<text x="1430.0" y="224.0" font-size="20" fill="#990000" text-anchor="end" font-weight="600">mixed documents, triage</text>
<rect x="760.0" y="194.0" width="80.0" height="40.0" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/>
<line x1="842.0" y1="214.0" x2="950.0" y2="190.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
