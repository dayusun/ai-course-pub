<line x1="902.0" y1="362.0" x2="980.0" y2="336.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="982.0" y="320.0" width="70.0" height="32.0" rx="6" fill="#ffffff" stroke="#ddd5c6" stroke-width="1.5"/>
<rect x="40.0" y="406.0" width="1420.0" height="104.0" rx="12" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="70.0" y="450.0" font-size="26" fill="#4b0000" text-anchor="start" font-weight="700">Orchestrator–workers</text>
<text x="70.0" y="486.0" font-size="20" fill="#20201e" text-anchor="start" font-weight="400">one step plans, workers do bounded parts</text>
<text x="1430.0" y="468.0" font-size="20" fill="#990000" text-anchor="end" font-weight="600">name a human owner</text>
<rect x="760.0" y="438.0" width="80.0" height="40.0" rx="6" fill="#ffffff" stroke="#4b0000" stroke-width="1.5"/>
<line x1="842.0" y1="458.0" x2="928.0" y2="432.0" stroke="#4b0000" stroke-width="2" marker-end="url(#arr)"/>
