<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" font-family="Aptos, &apos;Segoe UI&apos;, Arial, sans-serif" role="img" aria-label="A context window filled by system prompt, memory, conversation, attached papers and room for the answer; four ways to make room: select, retrieve, summarize, split the work">
<defs><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 2 1.5 L 9 6 L 2 10.5 Z" fill="#4b0000"/></marker></defs>
<rect width="1500" height="520" fill="#f7f3ea"/>
<text x="40.0" y="60.0" font-size="24" fill="#20201e" text-anchor="start" font-weight="600">One context window, late in a long session (illustrative shares)</text>
<rect x="40.0" y="90.0" width="142.0" height="110.0" rx="0" fill="#e3eef9" stroke="#4b0000" stroke-width="2"/>
<text x="111.0" y="140.0" font-size="16" fill="#4b0000" text-anchor="middle" font-weight="700">System + tools</text>
<text x="111.0" y="172.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">10%</text>
<rect x="182.0" y="90.0" width="99.4" height="110.0" rx="0" fill="#e2f0de" stroke="#4b0000" stroke-width="2"/>
<text x="231.7" y="140.0" font-size="16" fill="#4b0000" text-anchor="middle" font-weight="700">Memory</text>
<text x="231.7" y="172.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">7%</text>
<rect x="281.4" y="90.0" width="539.6" height="110.0" rx="0" fill="#fffdf8" stroke="#4b0000" stroke-width="2"/>
<text x="551.2" y="140.0" font-size="20" fill="#4b0000" text-anchor="middle" font-weight="700">Conversation so far</text>
<text x="551.2" y="172.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">38%</text>
<rect x="821.0" y="90.0" width="426.0" height="110.0" rx="0" fill="#fbefd6" stroke="#4b0000" stroke-width="2"/>
<text x="1034.0" y="140.0" font-size="20" fill="#4b0000" text-anchor="middle" font-weight="700">Attached papers</text>
<text x="1034.0" y="172.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">30%</text>
<rect x="1247.0" y="90.0" width="213.0" height="110.0" rx="0" fill="#ffffff" stroke="#990000" stroke-width="2"/>
<text x="1353.5" y="140.0" font-size="20" fill="#4b0000" text-anchor="middle" font-weight="700">Room left</text>
<text x="1353.5" y="172.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">15%</text>
<text x="1460.0" y="234.0" font-size="18" fill="#68635d" text-anchor="end" font-weight="400">full window: everything above must fit, every turn</text>
<rect x="40.0" y="300.0" width="330.0" height="150.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="205.0" y="352.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Select</text>
<text x="205.0" y="392.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">send only the pages that matter</text>
<rect x="402.0" y="300.0" width="330.0" height="150.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="567.0" y="352.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Retrieve</text>
<text x="567.0" y="392.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">fetch passages on demand (RAG)</text>
<rect x="764.0" y="300.0" width="330.0" height="150.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="929.0" y="352.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Summarize / compact</text>
<text x="929.0" y="392.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">replace old turns with a summary</text>
<rect x="1126.0" y="300.0" width="330.0" height="150.0" rx="12" fill="#fffdf8" stroke="#e3a617" stroke-width="2.5"/>
<text x="1291.0" y="352.0" font-size="26" fill="#4b0000" text-anchor="middle" font-weight="700">Split the work</text>
<text x="1291.0" y="392.0" font-size="18" fill="#68635d" text-anchor="middle" font-weight="400">a subagent reads, reports back</text>
<text x="40.0" y="495.0" font-size="20" fill="#990000" text-anchor="start" font-weight="600">Each way drops or rewrites something: record what was selected, summarized or left out.</text>
</svg>
